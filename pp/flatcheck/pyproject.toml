[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flatcheck"
version = "0.1.0"
description = "Flattening-quality checker for tifxyz scroll meshes: isometry metric, fold-overs, collapse detector, SLIM/ARAP re-flattening"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "tifffile>=2023.1", "libigl>=2.5"]

[project.optional-dependencies]
test = ["pytest>=7"]
demo = ["boto3>=1.28"]

[project.scripts]
flatcheck = "flatcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
