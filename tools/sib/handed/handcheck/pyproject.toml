[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "handcheck"
version = "0.1.0"
description = "Predict whether a tifxyz surface render reads mirrored or upside down, from geometry alone"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "tifffile"]

[project.optional-dependencies]
test = ["pytest", "opencv-python-headless"]
validate = ["opencv-python-headless"]

[project.scripts]
handcheck = "handcheck.cli:main"

[tool.setuptools]
packages = ["handcheck"]
