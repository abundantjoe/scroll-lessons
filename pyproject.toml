[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inkeval"
version = "1.0.0"
description = "Honest evaluation tools for ink detection in carbonised-scroll CT: stroke test, local stroke test, crop-level bootstrap, label-swap null, rank ensemble."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "abundantjoe" }]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pillow>=9.0"]
keywords = ["vesuvius-challenge", "herculaneum", "ink-detection", "evaluation", "computed-tomography"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Topic :: Scientific/Engineering :: Image Processing"]

[project.optional-dependencies]
test = ["pytest>=7"]
pipeline = ["torch>=2.0", "zarr>=2.16", "requests>=2.28", "matplotlib>=3.7", "scikit-image>=0.21"]

[project.scripts]
inkeval = "inkeval.cli:main"

[project.urls]
Repository = "https://github.com/abundantjoe/megara"

[tool.setuptools]
packages = ["inkeval"]

[tool.setuptools.package-data]
inkeval = ["data/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
